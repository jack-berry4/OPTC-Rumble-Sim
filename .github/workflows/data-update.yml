# Weekly OPTC-DB update (docs/LAUNCH_PLAN.md, "Keeping the site up to date"): when 2Shankz's OPTC-DB has new commits,
# rebuild data/units.json (--no-game: the game data stays as last built on the PC), run the checks, tests and build,
# and open (or update) a "Data update" pull request. Cloudflare builds that branch into a preview link; merging it
# publishes the data. Nothing goes live without a merge.
# Nydato's sheet is synced on the PC instead (Sync Data.bat): Google refuses GitHub's servers its portrait images.
# Free: a minute or two of GitHub Actions per run. Needs the repo setting "Allow GitHub Actions to create and approve
# pull requests" (Settings > Actions > General).
name: Data update
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: data-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: OPTC-DB (2Shankz)
        id: optcdb
        env:
          OPTC_GAME_DIR: /nonexistent # no game files here: keep the game data as last built
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run --silent db:check
          code=$?
          set -e
          if [ "$code" = 10 ]; then
            npx tsx scripts/db/build.ts --no-game
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != 0 ]; then exit "$code"; fi

      - name: Checks and tests
        if: steps.optcdb.outputs.changed == 'true'
        run: npm run db:verify

      - name: Build
        if: steps.optcdb.outputs.changed == 'true'
        run: npm run build

      - name: Pull request text
        if: steps.optcdb.outputs.changed == 'true'
        run: |
          {
            echo "Weekly OPTC-DB update (.github/workflows/data-update.yml)."
            echo "Checks, tests and the build passed. Cloudflare's preview link for this branch shows the site with the new data; merging publishes it."
            echo
            git status --short -- data
            new=$(git status --porcelain -- data/reports | awk '{print $2}' | grep '\.md$' | tail -1)
            if [ -n "$new" ]; then echo; cat "$new"; fi
          } > "$RUNNER_TEMP/pr.md"
          head -c 60000 "$RUNNER_TEMP/pr.md" > "$RUNNER_TEMP/pr-short.md"

      - uses: peter-evans/create-pull-request@v8
        if: steps.optcdb.outputs.changed == 'true'
        with:
          branch: data-update
          delete-branch: true
          title: Data update (OPTC-DB)
          commit-message: "Data update: OPTC-DB"
          body-path: ${{ runner.temp }}/pr-short.md
          add-paths: |
            data/**
